name: Pages

on:
  push:
    branches:
      - trunk

jobs:
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://web.reprozip.org/
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install Nikola
      run: |
        pip install webassets
        pip install -U 'Nikola>=8,<9'
    - name: Build site
      run: nikola build
    - name: Setup pages
      uses: actions/configure-pages@v3
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v1
      with:
        path: public
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
